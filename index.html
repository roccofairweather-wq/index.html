<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Access Key Verification Screen -->
    <div id="loginScreen" class="login-wrapper">
        <div class="brand-logo">🔥 stormkiln</div>
        
        <!-- Error Popup Box -->
        <div id="errorMsg" class="error-banner" style="display: none;">
            ⚠️ Wrong key. Check it and try again.
        </div>

        <div class="auth-box">
            <label>ENTER YOUR KEY</label>
            <div class="input-row">
                <!-- Access key is hardcoded to 'mysecret123' -->
                <input type="password" id="accessKey" placeholder="••••••••" data-secret="mysecret123">
                <button onclick="checkKey()">➔</button>
            </div>
        </div>
        <p class="footer-note">Whoever sent you the link has the key.</p>
    </div>

    <!-- Main Portal Screen -->
    <div id="mainPortal" class="portal-wrapper" style="display: none;">
        <header>
            <h1>🔥 Portal Dashboard</h1>
            <p>Access granted. Enter a URL or search phrase below.</p>
        </header>

        <!-- Unblocked Proxy Search Bar -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="proxyUrl" placeholder="Enter URL or search term here..." onkeydown="if(event.key === 'Enter') launchProxy()">
                <button onclick="launchProxy()">Search Unblocked</button>
            </div>
        </div>

        <main class="grid-layout">
            <div class="app-card">
                <h3>DuckDuckGo Search</h3>
                <button onclick="launchProxyDirect('https://duckduckgo.com')">Launch Mirror</button>
            </div>
            <div class="app-card">
                <h3>Retro Arcade</h3>
                <button onclick="launchProxyDirect('https://play2048.co')">Launch</button>
            </div>
        </main>
    </div>

    <!-- Embedded Application Screen Wrapper -->
    <div id="appContainer" class="app-overlay" style="display: none;">
        <div class="app-window">
            <button class="exit-btn" onclick="closeApp()">❌ Exit Window</button>
            <iframe id="appFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function checkKey() {
            const inputField = document.getElementById('accessKey');
            const enteredKey = inputField.value;
            const correctKey = inputField.getAttribute('data-secret');
            const errorBox = document.getElementById('errorMsg');

            if (enteredKey === correctKey) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainPortal').style.display = 'block';
            } else {
                errorBox.style.display = 'block';
                inputField.value = '';
            }
        }

        function launchProxy() {
            let url = document.getElementById('proxyUrl').value.trim();
            if (!url) return;

            // Determines if it is a website link or search terms
            const isUrl = url.includes('.') && !url.includes(' ');

            if (isUrl) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
            } else {
                // Routes text searches securely through DuckDuckGo HTML layout
                url = 'https://duckduckgo.com?q=' + encodeURIComponent(url);
            }
            
            const proxyEndpoint = window.location.origin + '/proxy/' + url;
            launchApp(proxyEndpoint);
        }

        function launchProxyDirect(url) {
            const proxyEndpoint = window.location.origin + '/proxy/' + url;
            launchApp(proxyEndpoint);
        }

        function launchApp(url) {
            document.getElementById('appFrame').src = url;
            document.getElementById('appContainer').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('appFrame').src = '';
        }
    </script>
</body>
</html>
