<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Access Key Verification Screen -->
    <div id="loginScreen" class="login-wrapper">
        <div class="brand-logo">🔥 stormkiln</div>
        
        <!-- Error Popup Box -->
        <div id="errorMsg" class="error-banner" style="display: none;">
            ⚠️ Wrong key. Check it and try again.
        </div>

        <div class="auth-box">
            <label>ENTER YOUR NEW KEY</label>
            <div class="input-row">
                <!-- Change 'mysecret123' to your new desired password right below -->
                <input type="password" id="accessKey" placeholder="••••••••" data-secret="mysecret123">
                <button onclick="checkKey()">➔</button>
            </div>
        </div>
        <p class="footer-note">Whoever sent you the link has the key.</p>
    </div>

    <!-- Main Portal Screen -->
    <div id="mainPortal" class="portal-wrapper" style="display: none;">
        <header>
            <h1>🔥 Portal Dashboard</h1>
            <p>Access granted. Enter a URL below to browse unblocked.</p>
        </header>

        <!-- Unblocked Proxy Search Bar -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="proxyUrl" placeholder="Enter URL here (e.g., instagram.com)..." onkeydown="if(event.key === 'Enter') launchProxy()">
                <button onclick="launchProxy()">Browse Unblocked</button>
            </div>
        </div>

        <main class="grid-layout">
            <div class="app-card">
                <h3>Google Search</h3>
                <button onclick="launchProxyDirect('https://google.com')">Launch Mirror</button>
            </div>
            <div class="app-card">
                <h3>Retro Arcade</h3>
                <button onclick="launchProxyDirect('https://play2048.co')">Launch</button>
            </div>
        </main>
    </div>

    <!-- Embedded Application Screen Wrapper -->
    <div id="appContainer" class="app-overlay" style="display: none;">
        <div class="app-window">
            <button class="exit-btn" onclick="closeApp()">❌ Exit Window</button>
            <iframe id="appFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
      function launchProxy() {
    let url = document.getElementById('proxyUrl').value.trim();
    if (!url) return;

    // Check if the user typed a website domain link or just random text words
    const isUrl = url.includes('.') && !url.includes(' ');

    if (isUrl) {
        // If it's a website, ensure it has the correct network protocols
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
    } else {
        // If it's text words, use DuckDuckGo instead of Google to bypass bot blocks!
        url = 'https://duckduckgo.com' + encodeURIComponent(url);
    }
    
    // Send it through your live Render proxy channel
    const proxyEndpoint = window.location.origin + '/proxy/' + url;
    launchApp(proxyEndpoint);
}
