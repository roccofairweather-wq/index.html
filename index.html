<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Access Key Verification Screen -->
    <div id="loginScreen" class="login-wrapper">
        <div class="brand-logo">🔥 stormkiln</div>
        
        <div id="errorMsg" class="error-banner" style="display: none;">
            ⚠️ Wrong key. Check it and try again.
        </div>

        <div class="auth-box">
            <label>ENTER YOUR KEY</label>
            <div class="input-row">
                <input type="password" id="accessKey" placeholder="••••••••">
                <button onclick="checkKey()">➔</button>
            </div>
        </div>
        <p class="footer-note">Whoever sent you the link has the key.</p>
    </div>

    <!-- Main Portal Screen -->
    <div id="mainPortal" class="portal-wrapper" style="display: none;">
        <header>
            <h1>🔥 Portal Dashboard</h1>
            <p>Access granted. Enter a URL or search phrase below.</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="proxyUrl" placeholder="Enter URL or search term here...">
                <button onclick="launchProxy()">Search Unblocked</button>
            </div>
        </div>

        <main class="grid-layout">
            <div class="app-card">
                <h3>DuckDuckGo Search</h3>
                <button onclick="launchProxyDirect('https://duckduckgo.com')">Launch Mirror</button>
            </div>
            <div class="app-card">
                <h3>Retro Arcade</h3>
                <button onclick="launchProxyDirect('https://play2048.co')">Launch</button>
            </div>
        </main>
    </div>

    <!-- Embedded Application Screen Wrapper -->
    <div id="appContainer" class="app-overlay" style="display: none;">
        <div class="app-window">
            <button class="exit-btn" onclick="closeApp()">❌ Exit Window</button>
            <iframe id="appFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Simple, clean password verification
        function checkKey() {
            const enteredKey = document.getElementById('accessKey').value;
            const errorBox = document.getElementById('errorMsg');

            if (enteredKey === 'mysecret123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainPortal').style.display = 'block';
            } else {
                errorBox.style.display = 'block';
                document.getElementById('accessKey').value = '';
            }
        }

        // Listens for Enter key on inputs
        document.getElementById('accessKey').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkKey();
        });
        document.getElementById('proxyUrl').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') launchProxy();
        });

        function launchProxy() {
            let searchInput = document.getElementById('proxyUrl').value.trim();
            if (!searchInput) return;

            let finalUrl = searchInput;
            const isUrl = searchInput.includes('.') && !searchInput.includes(' ');

            if (isUrl) {
                if (!searchInput.startsWith('http://') && !searchInput.startsWith('https://')) {
                    finalUrl = 'https://' + searchInput;
                }
            } else {
                finalUrl = 'https://duckduckgo.com?q=' + encodeURIComponent(searchInput);
            }
            
            // Sends search queries safely via Render routing
            const proxyEndpoint = window.location.origin + '/proxy/' + encodeURIComponent(finalUrl);
            launchApp(proxyEndpoint);
        }

        function launchProxyDirect(url) {
            const proxyEndpoint = window.location.origin + '/proxy/' + encodeURIComponent(url);
            launchApp(proxyEndpoint);
        }

        function launchApp(url) {
            document.getElementById('appFrame').src = url;
            document.getElementById('appContainer').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('appFrame').src = '';
        }
    </script>
</body>
</html>
